# =============================================================================
# NGINX site config
#   - serves the static dashboard from the document root  (Task 6)
#   - reverse-proxies the Shiny app at /ais_app            (Task 7.4)
# =============================================================================

server {
    listen 80;
    server_name _;

    # ---- Static dashboard (Task 6) -----------------------------------------
    # sample_points.html lives in the mounted document root, so it is served at
    # http(s)://<host>/sample_points.html with no extra config.
    root  /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # ---- Shiny app at /ais_app (Task 7.4) ----------------------------------
    # Redirect the bare path to the trailing-slash form so relative asset URLs
    # inside the Shiny page resolve correctly.
    location = /ais_app {
        return 301 /ais_app/;
    }

    location /ais_app/ {
        proxy_pass http://shiny:3838/ais_app/;

        # Shiny relies on WebSockets; without these upgrade headers the app
        # loads and then greys out.
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout 20d;     # keep long-lived Shiny sessions alive
        proxy_buffering    off;
    }
}
